<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U-BT Cluj-Napoca Stats</title>
  <meta name="description" content="Statistici și analiză pentru echipa de baschet U-BT Cluj-Napoca.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=27">
  <style>
    /* ── Home page ────────────────────────────────────────────────────────── */
    .home-hero {
      text-align: center;
      padding: 48px 0 36px;
    }
    .home-hero-title {
      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -.5px;
    }
    .home-hero-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* ── Nav cards ────────────────────────────────────────────────────────── */
    .home-nav-row {
      display: flex;
      gap: 14px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .home-nav-card {
      flex: 1;
      min-width: 160px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color .15s, background .15s;
    }
    .home-nav-card:hover {
      border-color: var(--accent-border);
      background: var(--bg-card-alt);
    }
    .home-nav-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--accent-fill);
      border: 1px solid var(--accent-border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .home-nav-icon svg { width: 20px; height: 20px; stroke: var(--accent-text); }
    .home-nav-label { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .home-nav-desc  { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* ── Season comparison ────────────────────────────────────────────────── */
    .comp-section-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .comp-filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .comp-tab {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      background: none;
      cursor: pointer;
      transition: all .15s;
    }
    .comp-tab.active {
      background: var(--accent-fill);
      border-color: var(--accent-border);
      color: var(--accent-text);
    }
    .comp-tab:hover:not(.active) { border-color: var(--border-strong); color: var(--text-primary); }

    .season-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 40px;
    }
    .season-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .season-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .season-card-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .season-card-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .season-card-badge.best  { background: rgba(34,197,94,.12); color: #22c55e; }
    .season-card-badge.worst { background: rgba(230,57,70,.10); color: var(--red-text); }
    .season-card-badge.mid   { background: var(--bg-card-alt); color: var(--text-muted); }

    .season-metrics { display: flex; flex-direction: column; gap: 10px; }
    .season-metric  { display: flex; flex-direction: column; gap: 4px; }
    .season-metric-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .season-metric-bars  { display: flex; flex-direction: column; gap: 4px; }
    .season-bar-row { display: flex; align-items: center; gap: 8px; }
    .season-bar-year {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-secondary);
      width: 36px;
      flex-shrink: 0;
    }
    .season-bar-track {
      flex: 1;
      height: 6px;
      background: var(--bg-card-alt);
      border-radius: 3px;
      overflow: hidden;
    }
    .season-bar-fill {
      height: 100%;
      border-radius: 3px;
      background: var(--accent);
      transition: width .4s ease;
    }
    .season-bar-fill.green { background: #22c55e; }
    .season-bar-fill.red   { background: var(--red); }
    .season-bar-val {
      font-size: 12px;
      font-family: var(--mono);
      font-weight: 700;
      color: var(--text-primary);
      width: 42px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Big metrics row ──────────────────────────────────────────────────── */
    .home-kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 32px;
    }
    .home-kpi {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      text-align: center;
    }
    .home-kpi-val {
      font-size: 26px;
      font-weight: 800;
      font-family: var(--mono);
      color: var(--accent-text);
      line-height: 1;
    }
    .home-kpi-lbl {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .home-kpi-delta {
      font-size: 11px;
      font-family: var(--mono);
      margin-top: 3px;
    }
    .home-kpi-delta.pos { color: #22c55e; }
    .home-kpi-delta.neg { color: var(--red-text); }
    .home-kpi-delta.neu { color: var(--text-muted); }

    .home-loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body data-page="home">

<!-- ── Header ─────────────────────────────────────────────────────────── -->

  <div class="header-inner">
    <a class="brand" href="index.html">
      <div class="brand-logo-wrap"><img src="../logo-ubt.svg" class="brand-logo-img" alt="U-BT"></div>
      <div>
        <div class="brand-name">U-BT Cluj-Napoca</div>
        <div class="brand-sub">Player Stats</div>
      </div>

<main class="page" id="home-page">

</main>
