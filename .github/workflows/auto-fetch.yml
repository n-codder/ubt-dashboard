# Fetch automat: rulează din oră în oră. fetchers/auto_fetch.py decide, fără
# niciun apel API, dacă e ceva de adus:
#   - un meci din data/processed/schedule.json s-a terminat și lipsește din date
#   - sau a trecut intervalul fetch-ului de siguranță (config/auto_fetch.json, setat din admin)
# Când nu e nimic de făcut, job-ul se oprește în câteva secunde (fără pip install).
name: Fetch automat

on:
  schedule:
    - cron: "17 * * * *"   # din oră în oră, la minutul 17
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: E ceva de adus?
        id: decide
        run: python fetchers/auto_fetch.py --decide >> "$GITHUB_OUTPUT"

      - name: Instalează dependențele
        if: steps.decide.outputs.comps != ''
        run: pip install -r requirements.txt

      - name: Fetch
        if: steps.decide.outputs.comps != ''
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetchers/auto_fetch.py --run "${{ steps.decide.outputs.comps }}"

      - name: Publică datele noi
        if: steps.decide.outputs.comps != ''
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nimic nou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: fetch automat $(date -u +%Y-%m-%d)"
          git push
