# Fetch automat: rulează zilnic, iar fetchers/auto_fetch.py decide după
# config/auto_fetch.json (setat din admin) dacă e cazul să aducă date noi.
name: Fetch automat

on:
  schedule:
    - cron: "0 7 * * *"   # zilnic la 07:00 UTC (09:00/10:00 în România)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalează dependențele
        run: pip install -r requirements.txt

      - name: Fetch
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python fetchers/auto_fetch.py

      - name: Publică datele noi
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nimic nou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: fetch automat $(date -u +%Y-%m-%d)"
          git push
